<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldDay Pi — Admin</title>
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav>
  <strong>&#128225; FieldDay Pi Admin</strong>
  <div>
    <a href="/">Dashboard</a>
    <a href="/ap">AP Config</a>
    <a href="/logout">Log out</a>
  </div>
</nav>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
    <p class="msg msg-{{ cat }}">{{ msg }}</p>
  {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<footer>
  FieldDay Pi Server &mdash; <a href="http://{{ request.host.split(':')[0] }}/">Main Site</a>
</footer>

</body>
</html>
