##
## FieldDay Pi Server — Network Configuration
##
## Edit this file BEFORE running server_install.sh
##

# ── WiFi Access Point ─────────────────────────────────────────────────────────
# A USB WiFi adapter is required. Onboard WiFi (wlan0) is never used for the AP.

AP_SSID="FieldDay"
AP_PASSPHRASE="fieldday1234"
AP_CHANNEL=6
AP_IP="192.168.73.1"
AP_PREFIX=24
DHCP_START="192.168.73.10"
DHCP_END="192.168.73.200"
DHCP_LEASE="24h"
DOMAIN="fieldday.local"

# ── Samba File Sharing ────────────────────────────────────────────────────────

SHARE_NAME="fieldday"
SHARE_DIR="/home/pi/fieldday"
SMB_USER="fieldday"
SMB_PASS="fieldday"
